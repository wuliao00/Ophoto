name: CI

on:
  push:
  pull_request:

jobs:
  build:
    name: Lint / Unit Test / Debug & Release APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Prepare debug keystore (use repository secret if provided)
        env:
          DEBUG_KEYSTORE_B64: ${{ secrets.OPHOTO_DEBUG_KEYSTORE_B64 }}
        run: |
          set -euo pipefail
          if [ -n "${DEBUG_KEYSTORE_B64:-}" ]; then
            ks="${RUNNER_TEMP}/ophoto-debug.keystore"
            printf '%s' "${DEBUG_KEYSTORE_B64}" | base64 -d > "${ks}"
            echo "OPHOTO_DEBUG_KEYSTORE=${ks}" >> "${GITHUB_ENV}"
          fi

      - name: Run unit tests, lint, debug APK & instrumented test compilation
        run: ./gradlew --no-daemon testDebugUnitTest lintDebug assembleDebug assembleDebugAndroidTest

      - name: Assemble ProGuard/R8 release APK & verify baseline profile
        run: |
          set -euo pipefail
          ./gradlew --no-daemon assembleRelease
          apk="$(ls app/build/outputs/apk/release/*.apk | head -n 1)"
          echo "Inspecting release APK: ${apk}"
          listing="${RUNNER_TEMP}/apk-contents.txt"
          unzip -l "${apk}" > "${listing}"
          matched="$(grep -E 'assets/dexopt/baseline\.prof' "${listing}" || true)"
          if [ -z "${matched}" ]; then
            echo "::error::Missing assets/dexopt/baseline.prof* inside release APK"
            exit 1
          fi
          printf '%s\n' "${matched}"

      - name: Upload Debug APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Ophoto-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

      - name: Upload Room Schema Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Ophoto-room-schemas
          path: app/schemas/
          if-no-files-found: warn
