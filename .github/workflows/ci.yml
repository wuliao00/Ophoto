name: CI

on:
  push:
    branches: [ main, "arena/**" ]
  pull_request:
    branches: [ main ]

jobs:
  build-test-lint:
    name: Lint / Unit Test / Debug & Release APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Prepare debug keystore (use repository secret if provided)
        env:
          SIGNING_KEY_B64: ${{ secrets.OPHOTO_DEBUG_KEYSTORE_B64 }}
        run: |
          if [ -n "$SIGNING_KEY_B64" ]; then
            echo "$SIGNING_KEY_B64" | base64 -d > "$RUNNER_TEMP/ophoto-debug.keystore"
            echo "OPHOTO_DEBUG_KEYSTORE=$RUNNER_TEMP/ophoto-debug.keystore" >> "$GITHUB_ENV"
          fi

      - name: Run unit tests, lint, debug APK & instrumented test compilation
        run: ./gradlew testDebugUnitTest lintDebug assembleDebug assembleDebugAndroidTest --stacktrace 2>&1 | tee /tmp/gradlew-output.log

      - name: Dump Gradle output on failure
        if: failure()
        run: echo "===== GRADLE TAIL =====" && tail -n 120 /tmp/gradlew-output.log || true

      - name: Verify exported Room schemas match committed snapshots
        run: |
          git diff --exit-code -- app/schemas/
          test -z "$(git ls-files --others --exclude-standard app/schemas/)"

      - name: Assemble ProGuard/R8 release APK & verify baseline profile
        run: |
          ./gradlew assembleRelease --no-daemon 2>&1 | tee /tmp/release-build.log
          test -f app/src/main/baseline-prof.txt
          RELEASE_APK=$(ls app/build/outputs/apk/release/app-release*.apk | head -n 1)
          unzip -l "$RELEASE_APK" | grep -q "assets/dexopt/baseline.prof"

      - name: Dump Release build output on failure
        if: failure()
        run: echo "===== RELEASE BUILD TAIL =====" && tail -n 120 /tmp/release-build.log || true

      - name: Upload Debug APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Ophoto-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk

      - name: Upload Room Schema Artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Ophoto-room-schemas
          path: app/schemas/
