name: Release APK

on:
  push:
    branches:
      - main
      - "arena/**"
    paths:
      - "RELEASE_MANIFEST.json"
  workflow_dispatch:
    inputs:
      tag_name:
        description: "Release tag to create or update (e.g. v1.0.0)"
        required: false
        default: "v1.0.0"

permissions:
  contents: write

jobs:
  release-apk:
    name: Build, Sign & Publish Release APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Resolve Release Version & Prepare Signing Keystore
        env:
          INPUT_TAG: ${{ github.event.inputs.tag_name }}
          REL_KEYSTORE_B64: ${{ secrets.OPHOTO_RELEASE_KEYSTORE_B64 }}
          REL_STORE_PASSWORD: ${{ secrets.OPHOTO_RELEASE_STORE_PASSWORD }}
          REL_KEY_ALIAS: ${{ secrets.OPHOTO_RELEASE_KEY_ALIAS }}
          REL_KEY_PASSWORD: ${{ secrets.OPHOTO_RELEASE_KEY_PASSWORD }}
          DBG_KEYSTORE_B64: ${{ secrets.OPHOTO_DEBUG_KEYSTORE_B64 }}
        run: |
          set -euo pipefail
          read -r MANIFEST_TAG MANIFEST_VER CODENAME < <(python3 -c '
          import json
          with open("RELEASE_MANIFEST.json", encoding="utf-8") as f:
              m = json.load(f)
          print(m["tag"], m["version"], m.get("codename", "Release"))
          ')
          TAG="${INPUT_TAG:-$MANIFEST_TAG}"
          VERSION="${TAG#v}"
          echo "RELEASE_TAG=${TAG}" >> "$GITHUB_ENV"
          echo "RELEASE_VERSION=${VERSION}" >> "$GITHUB_ENV"
          echo "RELEASE_CODENAME=${CODENAME}" >> "$GITHUB_ENV"

          KEYSTORE_PATH="$RUNNER_TEMP/ophoto-release.jks"
          if [ -n "$REL_KEYSTORE_B64" ]; then
            echo "SIGNING_NOTE=使用仓库配置的签名密钥。" >> "$GITHUB_ENV"
            echo "$REL_KEYSTORE_B64" | base64 -d > "$KEYSTORE_PATH"
            echo "OPHOTO_RELEASE_STORE_FILE=${KEYSTORE_PATH}" >> "$GITHUB_ENV"
            echo "OPHOTO_RELEASE_STORE_PASSWORD=${REL_STORE_PASSWORD}" >> "$GITHUB_ENV"
            echo "OPHOTO_RELEASE_KEY_ALIAS=${REL_KEY_ALIAS}" >> "$GITHUB_ENV"
            echo "OPHOTO_RELEASE_KEY_PASSWORD=${REL_KEY_PASSWORD}" >> "$GITHUB_ENV"
          else
            echo "SIGNING_NOTE=本次构建使用临时签名，无法直接覆盖安装其他签名的旧版；卸载会清除本地应用数据，请先备份。" >> "$GITHUB_ENV"
            STORE_PASS="ophoto2026release"
            KEY_ALIAS="ophoto_release"
            keytool -genkeypair \
              -keystore "$KEYSTORE_PATH" \
              -storetype PKCS12 \
              -keyalg RSA \
              -keysize 2048 \
              -validity 10000 \
              -alias "$KEY_ALIAS" \
              -storepass "$STORE_PASS" \
              -keypass "$STORE_PASS" \
              -dname "CN=Ophoto Release, OU=Optical Lab, O=Ophoto Open Source, L=Hong Kong, C=HK"
            echo "OPHOTO_RELEASE_STORE_FILE=${KEYSTORE_PATH}" >> "$GITHUB_ENV"
            echo "OPHOTO_RELEASE_STORE_PASSWORD=${STORE_PASS}" >> "$GITHUB_ENV"
            echo "OPHOTO_RELEASE_KEY_ALIAS=${KEY_ALIAS}" >> "$GITHUB_ENV"
            echo "OPHOTO_RELEASE_KEY_PASSWORD=${STORE_PASS}" >> "$GITHUB_ENV"
          fi

          if [ -n "$DBG_KEYSTORE_B64" ]; then
            echo "$DBG_KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/ophoto-debug.keystore"
            echo "OPHOTO_DEBUG_KEYSTORE=$RUNNER_TEMP/ophoto-debug.keystore" >> "$GITHUB_ENV"
          fi

      - name: Build Signed Release & Debug APKs + Verify Signatures
        run: |
          set +e
          ./gradlew testDebugUnitTest lintDebug assembleRelease assembleDebug --stacktrace > release-build.log 2>&1
          RC=$?
          cat release-build.log
          if [ $RC -ne 0 ]; then
            grep -E '(^e:|^error:|^\* What went wrong:|^> |^Caused by:|FAILED|Exception|Execution failed|OutOfMemory)' release-build.log | head -n 35 | while IFS= read -r line; do
              echo "::error::${line}"
            done || true
            DIAG=$(tail -n 35 release-build.log | python3 -c 'import sys; print("%0A".join(l.rstrip() for l in sys.stdin)[:3200])')
            echo "::error title=RELEASE_BUILD_DIAG::${DIAG}"
            exit $RC
          fi
          set -euo pipefail

          mkdir -p dist
          RELEASE_OUT="dist/Ophoto-${RELEASE_TAG}-release.apk"
          DEBUG_OUT="dist/Ophoto-${RELEASE_TAG}-debug.apk"
          cp app/build/outputs/apk/release/app-release.apk "$RELEASE_OUT"
          cp app/build/outputs/apk/debug/app-debug.apk "$DEBUG_OUT"
          test "$(stat -c%s "$RELEASE_OUT")" -gt 20971520

          # Verify ART Baseline Profile inside signed R8 release APK
          unzip -l "$RELEASE_OUT" | grep -q "assets/dexopt/baseline.prof"

          # Cryptographically verify V1/V2/V3 signatures with Android SDK apksigner
          APKSIGNER=$(ls -1 "$ANDROID_HOME"/build-tools/*/apksigner | sort -V | tail -n 1)
          CERT_INFO=$("$APKSIGNER" verify --verbose --print-certs "$RELEASE_OUT")
          echo "$CERT_INFO"
          "$APKSIGNER" verify --verbose "$DEBUG_OUT"

          CERT_SHA256=$(echo "$CERT_INFO" | grep -Eo '[0-9a-fA-F]{64}' | head -n 1 || true)
          echo "CERT_SHA256=${CERT_SHA256:-Verified}" >> "$GITHUB_ENV"

          (
            cd dist
            sha256sum "Ophoto-${RELEASE_TAG}-release.apk" "Ophoto-${RELEASE_TAG}-debug.apk" > SHA256SUMS.txt
          )
          cat dist/SHA256SUMS.txt

      - name: Upload Signed APKs Workflow Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Ophoto-${{ env.RELEASE_TAG }}-apks
          path: dist/

      - name: Publish GitHub Release & Upload APK Assets
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set +e
          REL_SIZE=$(du -h "dist/Ophoto-${RELEASE_TAG}-release.apk" | cut -f1)
          DBG_SIZE=$(du -h "dist/Ophoto-${RELEASE_TAG}-debug.apk" | cut -f1)
          REL_SHA=$(awk '/-release\.apk/ {print $1}' dist/SHA256SUMS.txt)
          DBG_SHA=$(awk '/-debug\.apk/ {print $1}' dist/SHA256SUMS.txt)
          export REL_SIZE DBG_SIZE REL_SHA DBG_SHA

          python3 -c '
          import os, textwrap
          tag = os.environ["RELEASE_TAG"]
          repo = os.environ["GITHUB_REPOSITORY"]
          rel_size = os.environ["REL_SIZE"]
          dbg_size = os.environ["DBG_SIZE"]
          rel_sha = os.environ["REL_SHA"]
          dbg_sha = os.environ["DBG_SHA"]
          cert_sha = os.environ.get("CERT_SHA256", "Verified")
          signing_note = os.environ["SIGNING_NOTE"]
          notes = textwrap.dedent(f"""\
              ## Ophoto {tag}

              - 修复取景画面可能被界面遮挡，改用 CameraX 兼容预览；启动失败时可重试。
              - 默认自动曝光 +0.7 EV，可通过顶部「曝光」调整，实际补偿取决于设备支持范围。
              - 取景显示原片，所选滤镜在照片保存时应用；峰值对焦、斑马纹及实时滤镜预览暂不可用。
              - 拍摄或保存失败会显示错误，不再保存模拟画面。
              - 未在所有设备实机验证，预览亮度仍受设备、光线和曝光能力限制。

              ### 下载
              - [正式 APK ({rel_size})](https://github.com/{repo}/releases/download/{tag}/Ophoto-{tag}-release.apk) · SHA-256 `{rel_sha}`
              - [调试 APK ({dbg_size})](https://github.com/{repo}/releases/download/{tag}/Ophoto-{tag}-debug.apk) · SHA-256 `{dbg_sha}`

              **签名提示：{signing_note}**

              APK 证书 SHA-256：`{cert_sha}`
          """)
          with open("release-notes.md", "w", encoding="utf-8") as f:
              f.write(notes)
          '

          PUBLISH_LOG="publish.log"
          (
            set -euo pipefail
            if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
              echo "Release $RELEASE_TAG already exists; preserving its tag and signed assets."
            else
              gh release create "$RELEASE_TAG" \
                "dist/Ophoto-${RELEASE_TAG}-release.apk" \
                "dist/Ophoto-${RELEASE_TAG}-debug.apk" \
                "dist/SHA256SUMS.txt" \
                --target "$GITHUB_SHA" \
                --title "Ophoto ${RELEASE_TAG} · ${RELEASE_CODENAME} (Signed APK)" \
                --notes-file release-notes.md \
                --latest
            fi
          ) > "$PUBLISH_LOG" 2>&1
          PUB_RC=$?
          cat "$PUBLISH_LOG"
          if [ $PUB_RC -ne 0 ]; then
            PDIAG=$(cat "$PUBLISH_LOG" | python3 -c 'import sys; print("%0A".join(l.rstrip() for l in sys.stdin)[:3200])')
            echo "::error title=RELEASE_PUBLISH_DIAG::${PDIAG}"
            exit $PUB_RC
          fi
